<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Browser extensions manager UI</title>
</head>
<body>

  <header>
    <img src="assets/images/logo-light.svg" alt="logo-light-icon" class="logo-light">
    <img src="assets/images/logo-dark.svg" alt="dark-logo-icon" class="logo-dark">
    <button class="mode-btn" id="mode-btn" aria-label="Toggle dark mode">
      <img src="assets/images/icon-moon.svg" alt="">
    </button>
  </header>

  <main class="container">
    <h1 class="title-page">Browser Extensions Manager</h1>

    <section class="filter">
      <h2>Extension List</h2>
      <aside class="filter-btns" aria-label="Filter extensions">
        <button>all</button>
        <button>active</button>
        <button>inactive</button>
      </aside>
    </section>

    <section class="filtered-results">
      <!-- Extension cards go here -->
    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://mugisha-isaie.vercel.app/">Mugisha Isaie</a>.
  </footer>

  <script src="script.js"></script>
</body>
</html>
